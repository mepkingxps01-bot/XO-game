<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XO Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>XO Game</h1>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="player-label x">X</span>
        <span class="score" id="x-score">0</span>
      </div>
      <div class="score-card draws">
        <span class="player-label">Draws</span>
        <span class="score" id="draw-score">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="player-label o">O</span>
        <span class="score" id="o-score">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="buttons">
      <button id="restart-btn">New Game</button>
      <button id="reset-btn">Reset Scores</button>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="result-modal">
      <div class="result-icon" id="result-icon"></div>
      <h2 id="result-text"></h2>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
